name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar el sitio y comprobar que no hay cambios sin subir
        run: |
          python tools/build.py
          test -z "$(git status --porcelain)" || { git status --short; echo "El sitio generado difiere del subido: ejecuta python tools/build.py y sube los cambios"; exit 1; }
      - name: Higiene (hreflang, sitemap, robots, enlaces)
        run: python tests/hygiene.py
      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Pruebas de navegador
        run: |
          python tests/smoke.py
          python tests/reloc_smoke.py
          python tests/tracker_smoke.py
          python tests/analytics.py
